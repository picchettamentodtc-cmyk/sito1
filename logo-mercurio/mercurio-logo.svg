<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Mercurio logo">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9AA4B2"/>
      <stop offset="50%" stop-color="#D7DEE8"/>
      <stop offset="100%" stop-color="#6B7585"/>
    </linearGradient>
    <linearGradient id="quicksilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5BA3C9"/>
      <stop offset="100%" stop-color="#2F6F95"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="#F5F6F8"/>
  <!-- Mercury symbol mark -->
  <g transform="translate(400 290)">
    <!-- crescent horns -->
    <path d="M-54 -78 C-54 -118 -18 -142 0 -142 C18 -142 54 -118 54 -78"
          fill="none" stroke="url(#quicksilver)" stroke-width="18" stroke-linecap="round"/>
    <path d="M-28 -92 C-28 -112 -12 -124 0 -124 C12 -124 28 -112 28 -92"
          fill="none" stroke="#1A1D23" stroke-width="10" stroke-linecap="round"/>
    <!-- circle -->
    <circle cx="0" cy="-8" r="58" fill="none" stroke="#1A1D23" stroke-width="18"/>
    <circle cx="0" cy="-8" r="42" fill="none" stroke="url(#silver)" stroke-width="6"/>
    <!-- cross -->
    <line x1="0" y1="50" x2="0" y2="118" stroke="#1A1D23" stroke-width="18" stroke-linecap="round"/>
    <line x1="-36" y1="86" x2="36" y2="86" stroke="#1A1D23" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="400" y="560" text-anchor="middle"
        font-family="Montserrat, Avenir Next, Segoe UI, Helvetica Neue, sans-serif"
        font-size="78" font-weight="700" letter-spacing="14" fill="#1A1D23">MERCURIO</text>
  <line x1="250" y1="590" x2="550" y2="590" stroke="url(#quicksilver)" stroke-width="3" stroke-linecap="round"/>
</svg>
